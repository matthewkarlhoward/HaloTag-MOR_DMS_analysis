# Ligand panel metadata for the mu-opioid receptor DMS multidrug screen.
#
# emax_trupath : WT TRUPATH Gi1 Emax, % of DAMGO
#                (trupath_vs_camp_efficacy/param_table.csv, tp_emax column)
# emax_camp    : WT transcriptional cAMP Emax, % of DAMGO (camp_emax column)
# class        : efficacy bin, matching plots/radars/radars.Rmd conventions
# is_holdout   : excluded from the rank-1 kappa fit; used as the Phase 1 test set
# n_replicates : FACS sort replicates present in dms_data/multidrug_counts
#
# NOTE: SR17018 and MCAM have no WT TRUPATH measurement in param_table.csv.
#       SR17018 is treated as an agonist column in the fit but is dropped from
#       the s_l vs Emax diagnostic. MCAM (methocinnamox) is an antagonist and
#       is held out.

